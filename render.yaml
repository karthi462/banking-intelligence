services:
  # Unified Full-Stack Service (React 19 Frontend + FastAPI Analytics Backend)
  - type: web
    name: banking-intelligence-1
    env: python
    region: singapore
    plan: free
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build && pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: NODE_VERSION
        value: 20.11.0
